
<!DOCTYPE html>
<html>
<head>
    <title>GreenHarvest - Irrigation Settings</title>
    <link rel="stylesheet" href="practicum 15.css">
</head>
<body>

    <div class="container">

        <h1>GreenHarvest Industries</h1>
        <p class="subtitle">Smart Agriculture Management</p>

        <div class="settings-box">
            <h2>Irrigation Settings</h2>

            <p>Enable or disable the automatic irrigation system.</p>

            <div class="toggle-section">

                <span>Automatic Irrigation</span>

                <label class="switch">
                    <input type="checkbox" id="irrigationToggle">
                    <span class="slider"></span>
                </label>

            </div>

            <div id="statusBox">
                <p id="statusText">Automatic Irrigation is OFF</p>
            </div>

            <p class="description">
                When enabled, the system automatically manages
                the irrigation process for crops.
            </p>

        </div>

        <footer>
            <p>© 2026 GreenHarvest Industries</p>
        </footer>

    </div>

    <script src="practicum 15.js"></script>
</body>
</html>
